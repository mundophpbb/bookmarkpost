<!-- INCLUDE ucp_header.html -->

<form id="ucp" method="post" action="{S_UCP_ACTION}"{S_FORM_ENCTYPE}>
    <div class="panel">
        <div class="inner">
            <h2>{L_BOOKMARK_POST_TITLE}</h2>
            <p>{L_POST_BOOKMARKS_EXPLAIN}</p>

            <!-- IF .postrow -->
                <div class="action-bar top">
                    <div class="pagination">
                        {TOTAL_POSTS}
                        <!-- IF .pagination -->
                            <!-- INCLUDE pagination.html -->
                        <!-- ELSE -->
                            &bull; {PAGE_NUMBER}
                        <!-- ENDIF -->
                    </div>
                </div>

                <div class="bookmarkpost-ucp-list" role="list">
                    <!-- BEGIN postrow -->
                    <div class="bookmarkpost-ucp-row" role="listitem">
                        <div class="bookmarkpost-ucp-main">
                            <a href="{postrow.U_POST}" class="topictitle bookmarkpost-ucp-title">
                                <!-- IF postrow.ICON_IMG -->
                                    <img class="post-icon" src="{T_ICONS_PATH}{postrow.ICON_IMG}" width="{postrow.ICON_IMG_WIDTH}" height="{postrow.ICON_IMG_HEIGHT}" alt="" />
                                <!-- ENDIF -->
                                {postrow.SUBJECT}
                            </a>
                            <div class="bookmarkpost-ucp-meta">{L_POST_BY_AUTHOR} {postrow.AUTHOR} &raquo; {postrow.DATE}</div>
                        </div>
                        <div class="bookmarkpost-ucp-mark">
                            <input type="checkbox" name="p[{postrow.POST_ID}]" id="p{postrow.POST_ID}" />
                        </div>
                    </div>
                    <!-- END postrow -->
                </div>

                <fieldset class="display-actions bookmarkpost-ucp-actions">
                    <label><a href="#" onclick="marklist('ucp', '', true); return false;">{L_MARK_ALL}</a> &bull; <a href="#" onclick="marklist('ucp', '', false); return false;">{L_UNMARK_ALL}</a></label>
                    <input class="button2" type="submit" name="unbookmark" value="{L_REMOVE_BOOKMARK_MARKED}" />
                    {S_FORM_TOKEN}
                </fieldset>

                <div class="action-bar bottom">
                    <div class="pagination">
                        {TOTAL_POSTS}
                        <!-- IF .pagination -->
                            <!-- INCLUDE pagination.html -->
                        <!-- ELSE -->
                            &bull; {PAGE_NUMBER}
                        <!-- ENDIF -->
                    </div>
                </div>
            <!-- ELSE -->
                <p class="error">{L_NO_BOOKMARKS}</p>
            <!-- ENDIF -->
        </div>
    </div>
</form>

<!-- INCLUDE ucp_footer.html -->
